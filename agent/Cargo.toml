[package]
name = "seamlesscontrol-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Protocol and input ownership core for SeamlessControl"

[lib]
name = "seamlesscontrol_core"
path = "src/lib.rs"

[dependencies]
snow = "0.10"
sha2 = "0.10"

[build-dependencies]
winres = "0.1.12"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
ashpd = { version = "0.13.13", features = ["input_capture", "file_chooser"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "signal", "net", "sync", "process"] }
reis = { version = "0.7.1", features = ["tokio"] }
futures-util = "0.3"
serde_json = "1.0"
xkbcommon = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
serde_json = "1.0"
mdns-sd = "0.21"
if-addrs = "0.15"
tao = "0.37.1"
tray-icon = "0.26.0"
wry = "0.57.0"
