<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 350" role="img" aria-labelledby="title description">
<title id="title">SeamlessControl across Omarchy and Windows</title>
<desc id="description">Three Omarchy monitors and a Windows monitor share a continuous cursor path.</desc>
