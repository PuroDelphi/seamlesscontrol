name: Release source assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or verify
        required: true
        type: string

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Package tagged source and checksum
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/package-source-release.sh "$RELEASE_TAG"
          version=${RELEASE_TAG#v}
          archive="seamlesscontrol-$version-source.tar.gz"
          for name in "$archive" "$archive.sha256"; do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              mkdir -p remote
              gh release download "$RELEASE_TAG" --pattern "$name" --dir remote
              cmp "dist/$name" "remote/$name"
            else
              gh release upload "$RELEASE_TAG" "dist/$name"
            fi
          done
          mkdir -p verified
          gh release download "$RELEASE_TAG" --pattern "$archive" --pattern "$archive.sha256" --dir verified
          (cd verified && sha256sum --check "$archive.sha256")
          printf 'Verified release assets for %s at %s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test portable core
        run: cargo test --locked --manifest-path agent/Cargo.toml --target x86_64-pc-windows-msvc --lib
      - name: Build tagged Windows executables
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --manifest-path agent/Cargo.toml --target x86_64-pc-windows-msvc --release --bin seamlesscontrol --bin seamlesscontrold
      - name: Package and publish Windows x64 ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $output = 'agent/target/x86_64-pc-windows-msvc/release'
          $archive = 'seamlesscontrol-windows-x64.zip'
          $package = 'windows-package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "$output/seamlesscontrol.exe", "$output/seamlesscontrold.exe" $package
          Compress-Archive -Path "$package/seamlesscontrol.exe", "$package/seamlesscontrold.exe" -DestinationPath $archive -Force
          $check = 'windows-package-check'
          Expand-Archive -Path $archive -DestinationPath $check -Force
          foreach ($name in @('seamlesscontrol.exe', 'seamlesscontrold.exe')) {
            $expected = (Get-FileHash -Algorithm SHA256 "$output/$name").Hash
            $actual = (Get-FileHash -Algorithm SHA256 "$check/$name").Hash
            if ($expected -ne $actual) { throw "ZIP verification failed: $name" }
          }
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$digest  $archive" | Set-Content -Encoding ascii -Path "$archive.sha256"
          $published = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list release assets' }
          foreach ($asset in @($archive, "$archive.sha256")) {
            if ($published -contains $asset) {
              New-Item -ItemType Directory -Force -Path remote | Out-Null
              gh release download $env:RELEASE_TAG --pattern $asset --dir remote
              if ($LASTEXITCODE -ne 0) { throw "Cannot download existing asset $asset" }
              $local = (Get-FileHash -Algorithm SHA256 $asset).Hash
              $existing = (Get-FileHash -Algorithm SHA256 "remote/$asset").Hash
              if ($local -ne $existing) { throw "Release asset differs from tagged build: $asset" }
            } else {
              gh release upload $env:RELEASE_TAG $asset
              if ($LASTEXITCODE -ne 0) { throw "Cannot upload $asset" }
            }
          }
          "Verified Windows x64 ZIP for $env:RELEASE_TAG at $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
