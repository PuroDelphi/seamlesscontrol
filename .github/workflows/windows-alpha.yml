name: Windows x64 alpha

on:
  push:
    branches: [alpha]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path agent/Cargo.toml --check
      - name: Test portable core on Windows x64
        run: cargo test --locked --manifest-path agent/Cargo.toml --target x86_64-pc-windows-msvc --lib
      - name: Build Windows x64 console agent
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --manifest-path agent/Cargo.toml --target x86_64-pc-windows-msvc --release --bin seamlesscontrold
      - name: Start the Windows executable
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\SeamlessControlSmoke"
          $exe = 'agent/target/x86_64-pc-windows-msvc/release/seamlesscontrold.exe'
          & $exe identity
          if ($LASTEXITCODE -ne 0) { throw 'Identity startup failed' }
          & $exe peers
          if ($LASTEXITCODE -ne 0) { throw 'Peer listing startup failed' }
      - name: Write executable checksum
        shell: pwsh
        run: |
          $output = 'agent/target/x86_64-pc-windows-msvc/release'
          $digest = (Get-FileHash -Algorithm SHA256 "$output/seamlesscontrold.exe").Hash.ToLowerInvariant()
          "$digest  seamlesscontrold.exe" | Set-Content -Encoding ascii -Path "$output/seamlesscontrold.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: seamlesscontrol-windows-x64-alpha
          path: |
            agent/target/x86_64-pc-windows-msvc/release/seamlesscontrold.exe
            agent/target/x86_64-pc-windows-msvc/release/seamlesscontrold.exe.sha256
          if-no-files-found: error
