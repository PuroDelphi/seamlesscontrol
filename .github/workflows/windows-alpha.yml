name: Windows x64

on:
  push:
    branches: [alpha, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path agent/Cargo.toml --check
      - name: Test portable core on Windows x64
        run: cargo test --locked --manifest-path agent/Cargo.toml --target x86_64-pc-windows-msvc --lib
      - name: Test Windows app session preferences
        run: cargo test --locked --manifest-path agent/Cargo.toml --target x86_64-pc-windows-msvc --bin seamlesscontrol
      - name: Test bundled Windows updater
        shell: pwsh
        run: ./tests/windows-update.Tests.ps1
      - name: Build Windows x64 app and agent
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --manifest-path agent/Cargo.toml --target x86_64-pc-windows-msvc --release --bin seamlesscontrol --bin seamlesscontrold
      - name: Verify the Windows app icon
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class SeamlessIconCheck {
              [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
              public static extern uint ExtractIconEx(string file, int index, IntPtr large, IntPtr small, uint count);
          }
          '@
          $exe = (Resolve-Path 'agent/target/x86_64-pc-windows-msvc/release/seamlesscontrol.exe').Path
          if ([SeamlessIconCheck]::ExtractIconEx($exe, -1, [IntPtr]::Zero, [IntPtr]::Zero, 0) -lt 1) {
            throw 'The Windows app executable has no embedded icon'
          }
      - name: Start the Windows executable
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\SeamlessControlSmoke"
          $exe = 'agent/target/x86_64-pc-windows-msvc/release/seamlesscontrold.exe'
          & $exe identity
          if ($LASTEXITCODE -ne 0) { throw 'Identity startup failed' }
          & $exe peers
          if ($LASTEXITCODE -ne 0) { throw 'Peer listing startup failed' }
      - name: Prepare Windows x64 package
        shell: pwsh
        run: |
          $output = 'agent/target/x86_64-pc-windows-msvc/release'
          $package = 'windows-package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $checksums = @()
          foreach ($name in @('seamlesscontrol.exe', 'seamlesscontrold.exe')) {
            Copy-Item "$output/$name" "$package/$name"
            $expected = (Get-FileHash -Algorithm SHA256 "$output/$name").Hash
            $actual = (Get-FileHash -Algorithm SHA256 "$package/$name").Hash
            if ($expected -ne $actual) { throw "Package verification failed: $name" }
            $checksums += "$($actual.ToLowerInvariant())  $name"
          }
          $checksums | Set-Content -Encoding ascii -Path "$package/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: seamlesscontrol-windows-x64
          path: windows-package/
          if-no-files-found: error
      - uses: actions/download-artifact@v8
        with:
          name: seamlesscontrol-windows-x64
          path: windows-package-check
      - name: Verify downloaded package contents
        shell: pwsh
        run: |
          $directory = 'windows-package-check'
          $expectedNames = @('seamlesscontrol.exe', 'seamlesscontrold.exe', 'SHA256SUMS.txt')
          $actualNames = @(Get-ChildItem $directory | ForEach-Object Name | Sort-Object)
          if (@(Compare-Object ($expectedNames | Sort-Object) $actualNames).Count -ne 0) {
            throw "Unexpected package contents: $($actualNames -join ', ')"
          }
          $checksums = Get-Content "$directory/SHA256SUMS.txt"
          foreach ($name in @('seamlesscontrol.exe', 'seamlesscontrold.exe')) {
            $actual = (Get-FileHash -Algorithm SHA256 "$directory/$name").Hash.ToLowerInvariant()
            if ($checksums -notcontains "$actual  $name") { throw "Checksum mismatch: $name" }
          }
