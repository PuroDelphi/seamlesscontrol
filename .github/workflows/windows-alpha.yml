name: Windows x64

on:
  push:
    branches: [alpha, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path agent/Cargo.toml --check
      - name: Test portable core on Windows x64
        run: cargo test --locked --manifest-path agent/Cargo.toml --target x86_64-pc-windows-msvc --lib
      - name: Build Windows x64 app and agent
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --manifest-path agent/Cargo.toml --target x86_64-pc-windows-msvc --release --bin seamlesscontrol --bin seamlesscontrold
      - name: Verify the Windows app icon
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class SeamlessIconCheck {
              [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
              public static extern uint ExtractIconEx(string file, int index, IntPtr large, IntPtr small, uint count);
          }
          '@
          $exe = (Resolve-Path 'agent/target/x86_64-pc-windows-msvc/release/seamlesscontrol.exe').Path
          if ([SeamlessIconCheck]::ExtractIconEx($exe, -1, [IntPtr]::Zero, [IntPtr]::Zero, 0) -lt 1) {
            throw 'The Windows app executable has no embedded icon'
          }
      - name: Start the Windows executable
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\SeamlessControlSmoke"
          $exe = 'agent/target/x86_64-pc-windows-msvc/release/seamlesscontrold.exe'
          & $exe identity
          if ($LASTEXITCODE -ne 0) { throw 'Identity startup failed' }
          & $exe peers
          if ($LASTEXITCODE -ne 0) { throw 'Peer listing startup failed' }
      - name: Write executable checksums
        shell: pwsh
        run: |
          $output = 'agent/target/x86_64-pc-windows-msvc/release'
          foreach ($name in @('seamlesscontrol.exe', 'seamlesscontrold.exe')) {
            $digest = (Get-FileHash -Algorithm SHA256 "$output/$name").Hash.ToLowerInvariant()
            "$digest  $name" | Set-Content -Encoding ascii -Path "$output/$name.sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: seamlesscontrol-windows-x64
          path: |
            agent/target/x86_64-pc-windows-msvc/release/seamlesscontrold.exe
            agent/target/x86_64-pc-windows-msvc/release/seamlesscontrold.exe.sha256
            agent/target/x86_64-pc-windows-msvc/release/seamlesscontrol.exe
            agent/target/x86_64-pc-windows-msvc/release/seamlesscontrol.exe.sha256
          if-no-files-found: error
