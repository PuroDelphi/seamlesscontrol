name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install native keyboard library
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Check Rust format
        run: cargo fmt --manifest-path agent/Cargo.toml --check
      - name: Test agent and protocol
        run: cargo test --locked --manifest-path agent/Cargo.toml --all-targets
      - name: Test bounded mDNS cache against hostile advertisements
        run: cargo test --manifest-path agent/vendor/mdns-sd/Cargo.toml --lib hostile_unique_advertisements_have_bounded_cache_and_ttl
      - name: Lint agent
        run: cargo clippy --locked --manifest-path agent/Cargo.toml --all-targets -- -D warnings
      - name: Check shell syntax
        run: bash -n packaging/*.sh scripts/*.sh tests/*.sh
      - name: Check setup completion receipt
        run: bash tests/setup_result.sh
      - name: Check bounded Omarchy panel paste
        run: python3 -m unittest discover -s tests -p test_ui_clipboard_reader.py -v
      - name: Publish marketplace commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo '## Marketplace submission'
            echo
            echo 'After this workflow passes, submit this exact 40-character Git commit SHA:'
            echo
            echo "\`$GITHUB_SHA\`"
            echo
            echo "Cargo.lock SHA256: \`$(sha256sum agent/Cargo.lock | cut -d ' ' -f 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
